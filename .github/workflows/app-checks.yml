# The checks every app in the ControlFreak family runs on each pull request and on every
# push to main: lint, typecheck, test and build, the same four that the apps' AGENTS.md
# requires before a merge. Each app calls this workflow from its own
# .github/workflows/checks.yml, so a change here reaches every app at once.
#
# The apps are TanStack Start projects installed with Bun (they have a bun.lock), so the
# steps run through `bun run`. Every app must have the four scripts `lint`, `typecheck`,
# `test` and `build`. The shared packages (controlfreak-design, orienteering-formats) are
# installed from GitHub tags, which needs no token since both repositories are public.

name: App checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
